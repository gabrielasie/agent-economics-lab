# A clean, professional light theme: an indigo accent on a near-white canvas, with neutral
# (not purple-tinted) cards and sidebar so the colour stays on the accent and the agent dots.
[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f8"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = true
